[package]
name = "curso-on"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Painel no terminal para configurar e criar cursos no Curso On"
repository = "https://github.com/caioribi7/curso-on"
rust-version = "1.80"

[[bin]]
name = "curso-on"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ctrlc = "3"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
